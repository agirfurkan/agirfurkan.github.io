<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furkan Ağır — Apps</title>
<style>
  :root { --bg:#F7F5F0; --text:#1C1B1A; --muted:#77736C; --tint:#4F5BD5; --card:#FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --text:#F2F0EC; --muted:#A09B93; --tint:#8A93F0; --card:#232323; } }
  body { background:var(--bg); color:var(--text); font:17px/1.55 -apple-system, system-ui, sans-serif; margin:0; padding:40px 16px; }
  main { max-width:640px; margin:0 auto; }
  a.card { display:block; background:var(--card); border-radius:16px; padding:20px; color:inherit; text-decoration:none; margin-top:16px; }
  a.card strong { color:var(--tint); font-size:20px; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<main>
<h1>Furkan Ağır</h1>
<p class="muted">Independent iOS apps.</p>
<a class="card" href="puzzle100/">
  <strong>Puzzle100</strong><br>
  <span class="muted">Fill the grid from 1 to 100. A number path puzzle with a new daily challenge.</span>
</a>
</main>
</body>
</html>
